name: security

# Supply-chain policy gate: cargo-deny enforces the RUSTSEC advisory database,
# the dependency license allow-list, duplicate-version tracking, and registry
# sources (config in deny.toml). The nightly schedule surfaces newly published
# advisories within a day even when nothing is being pushed; ci.yml's per-push
# cargo-audit job stays as the fast advisory check on the hot path.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "crates/**/Cargo.toml"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "crates/**/Cargo.toml"
      - ".github/workflows/security.yml"
  schedule:
    # Nightly advisory sweep (03:17 UTC).
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
