name: ci

# Continuous integration gate for every push and pull request. Before this
# workflow existed the only automated gate was `cargo test --workspace` inside
# scripts/release.sh (skippable with --skip-tests), and Windows/macOS code was
# exercised only at release time. This runs the same checks the release
# protocol documents — fmt, clippy -D warnings, and the full test suite — with
# tests on native runners for all three supported platforms.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full-matrix run: catches environment drift (runner images,
    # rustup/stable movement, upstream regressions) even on quiet days.
    - cron: "41 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, kind: linux, experimental: false }
          - { os: macos-latest, kind: macos, experimental: false }
          # Windows path-semantics debt was burned down (verbatim `\\?\` paths,
          # TOML backslash escaping, and CRLF snapshot fixtures); the suite is
          # green on windows-latest, so the job is now a blocking gate.
          - { os: windows-latest, kind: windows, experimental: false }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Check release profile compiles
        if: matrix.kind == 'linux'
        run: cargo check --workspace --release --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-audit
      - name: Audit dependencies for security advisories
        run: cargo audit

  # Builds with the declared minimum supported Rust version so `rust-version`
  # in Cargo.toml is a tested claim rather than a label.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins 1.95.0 and outranks the toolchain the action
      # installs as the rustup default; this environment override outranks the
      # file, so the check genuinely runs on the MSRV.
      # Keep in sync with `rust-version` in the workspace Cargo.toml.
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check workspace on the MSRV toolchain
        run: cargo check --workspace --locked
