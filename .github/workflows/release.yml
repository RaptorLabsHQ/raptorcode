name: release

# Cross-platform release builds. Produces native, tested binaries on each OS:
#   - Linux   → signed .deb (scripts/package-deb.sh)
#   - macOS   → universal (arm64 + x86_64) tar.gz  [unsigned; notarization
#               can be added later]
#   - Windows → x86_64 zip  [unsigned]
# Artifacts are uploaded to the workflow run (workflow_dispatch on a branch) and
# attached to a GitHub Release when running at a v* tag — whether the tag was
# pushed by hand, by scripts/release.sh, or by auto-release.yml (the normal
# path: every functional push to main auto-cuts a release). After publishing,
# the r2-sync job refreshes the website's download binaries in R2 when the
# CLOUDFLARE_API_TOKEN repo secret is configured.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, kind: linux }
          - { os: macos-latest, kind: macos }
          - { os: windows-latest, kind: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # ---- Linux: .deb ----
      - name: Build Linux .deb
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          bash scripts/package-deb.sh
          cd dist
          for f in *.deb; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      # ---- macOS: universal tar.gz ----
      - name: Build macOS universal
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release -p raptor-cli --bin raptor --bin raptorcode --target aarch64-apple-darwin
          cargo build --release -p raptor-cli --bin raptor --bin raptorcode --target x86_64-apple-darwin
          mkdir -p dist macos
          for b in raptor raptorcode; do
            lipo -create -output "macos/$b" \
              "target/aarch64-apple-darwin/release/$b" \
              "target/x86_64-apple-darwin/release/$b"
          done
          VERSION=$(awk -F' = ' '/^version = / { gsub(/"/,"",$2); print $2; exit }' Cargo.toml)
          tar -czf "dist/raptor-code_${VERSION}_macos_universal.tar.gz" -C macos raptor raptorcode
          cd dist
          for f in *.tar.gz; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -la

      # ---- Windows: x86_64 zip ----
      - name: Build Windows zip
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          cargo build --release -p raptor-cli --bin raptor --bin raptorcode
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/raptor-code_${version}_windows_x86_64.zip"
          Compress-Archive -Path target/release/raptor.exe, target/release/raptorcode.exe -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $zip -Leaf) | Out-File "$zip.sha256" -Encoding ascii
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raptor-${{ matrix.kind }}
          path: dist/*
          if-no-files-found: error

  release:
    name: github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the build-provenance attestation
      attestations: write # record it in the repo's attestation store
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      # SLSA build-provenance: cryptographically attest that these exact
      # binaries were produced by this workflow at this commit. Consumers can
      # verify with `gh attestation verify <file> --repo RaptorLabsHQ/raptorcode`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "artifacts/*"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true

  r2-sync:
    name: sync website downloads (R2)
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_DOWNLOADS_BUCKET }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "> R2 sync SKIPPED — set the CLOUDFLARE_API_TOKEN secret (R2 write scope) plus the CLOUDFLARE_ACCOUNT_ID and R2_DOWNLOADS_BUCKET repository variables to refresh the website downloads automatically." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.creds.outputs.configured == 'true'
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload binaries to R2 under the version-less serving keys
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          cd artifacts
          deb=(raptor-code_*_amd64.deb)
          mac=(raptor-code_*_macos_universal.tar.gz)
          win=(raptor-code_*_windows_x86_64.zip)
          [ -n "${deb[0]:-}" ] && npx --yes wrangler@4 r2 object put "$R2_BUCKET/raptor-code_amd64.deb" --file "${deb[0]}" --remote
          [ -n "${mac[0]:-}" ] && npx --yes wrangler@4 r2 object put "$R2_BUCKET/raptor-code_macos_universal.tar.gz" --file "${mac[0]}" --remote
          [ -n "${win[0]:-}" ] && npx --yes wrangler@4 r2 object put "$R2_BUCKET/raptor-code_windows_x86_64.zip" --file "${win[0]}" --remote
          # Publish a machine-readable manifest alongside the binaries so the
          # website renders the current version and checksums straight from R2 —
          # no per-release website edit or redeploy needed.
          if [ -n "${deb[0]:-}" ] && [ -n "${mac[0]:-}" ] && [ -n "${win[0]:-}" ]; then
            printf '{"version":"%s","released":"%s","sha256":{"linux":"%s","macos":"%s","windows":"%s"}}\n' \
              "${GITHUB_REF_NAME#v}" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "$(cut -d' ' -f1 "${deb[0]}.sha256")" \
              "$(cut -d' ' -f1 "${mac[0]}.sha256")" \
              "$(cut -d' ' -f1 "${win[0]}.sha256")" > latest.json
            npx --yes wrangler@4 r2 object put "$R2_BUCKET/latest.json" --file latest.json --content-type application/json --remote
          fi
          {
            echo "### R2 downloads refreshed to ${GITHUB_REF_NAME}"
            echo "The \`latest.json\` manifest was updated too, so raptorcode.dev serves the new version and SHA-256s automatically — no website edit required."
            echo '```'
            cat -- *.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
