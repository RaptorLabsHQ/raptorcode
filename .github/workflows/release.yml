name: release

# Cross-platform release builds. Produces native, tested binaries on each OS:
#   - Linux   → signed .deb (scripts/package-deb.sh)
#   - macOS   → universal (arm64 + x86_64) tar.gz  [unsigned beta; notarization
#               can be added later via Apple creds]
#   - Windows → x86_64 zip  [unsigned beta]
# Artifacts are uploaded to the workflow run (workflow_dispatch on a branch) and
# attached to a GitHub Release when running at a v* tag — whether the tag was
# pushed by hand, by scripts/release.sh, or by auto-release.yml (the normal
# path: every functional push to main auto-cuts a release). After publishing,
# the r2-sync job refreshes the website's download binaries in R2 when the
# CLOUDFLARE_API_TOKEN repo secret is configured.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, kind: linux }
          - { os: macos-latest, kind: macos }
          - { os: windows-latest, kind: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ---- Linux: .deb ----
      - name: Build Linux .deb
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          bash scripts/package-deb.sh
          cd dist
          for f in *.deb; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      # ---- macOS: universal tar.gz ----
      - name: Build macOS universal
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release -p raptor-cli --bin raptor --bin raptorcode --target aarch64-apple-darwin
          cargo build --release -p raptor-cli --bin raptor --bin raptorcode --target x86_64-apple-darwin
          mkdir -p dist macos
          for b in raptor raptorcode; do
            lipo -create -output "macos/$b" \
              "target/aarch64-apple-darwin/release/$b" \
              "target/x86_64-apple-darwin/release/$b"
          done
          VERSION=$(awk -F' = ' '/^version = / { gsub(/"/,"",$2); print $2; exit }' Cargo.toml)
          tar -czf "dist/raptor-code_${VERSION}_macos_universal.tar.gz" -C macos raptor raptorcode
          cd dist
          for f in *.tar.gz; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -la

      # ---- Windows: x86_64 zip ----
      - name: Build Windows zip
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          cargo build --release -p raptor-cli --bin raptor --bin raptorcode
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/raptor-code_${version}_windows_x86_64.zip"
          Compress-Archive -Path target/release/raptor.exe, target/release/raptorcode.exe -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $zip -Leaf) | Out-File "$zip.sha256" -Encoding ascii
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raptor-${{ matrix.kind }}
          path: dist/*
          if-no-files-found: error

  release:
    name: github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  r2-sync:
    name: sync website downloads (R2)
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: [redacted]
    steps:
      - name: Check Cloudflare credentials
        id: creds
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "> R2 sync SKIPPED — add a CLOUDFLARE_API_TOKEN repo secret (R2 write scope) to refresh raptorcode.dev downloads automatically." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload binaries to R2 under the version-less serving keys
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          cd artifacts
          deb=(raptor-code_*_amd64.deb)
          mac=(raptor-code_*_macos_universal.tar.gz)
          win=(raptor-code_*_windows_x86_64.zip)
          [ -n "${deb[0]:-}" ] && npx --yes wrangler@4 r2 object put "raptor-code-downloads/raptor-code_amd64.deb" --file "${deb[0]}" --remote
          [ -n "${mac[0]:-}" ] && npx --yes wrangler@4 r2 object put "raptor-code-downloads/raptor-code_macos_universal.tar.gz" --file "${mac[0]}" --remote
          [ -n "${win[0]:-}" ] && npx --yes wrangler@4 r2 object put "raptor-code-downloads/raptor-code_windows_x86_64.zip" --file "${win[0]}" --remote
          {
            echo "### R2 downloads refreshed to ${GITHUB_REF_NAME}"
            echo "Manual follow-up in **raptor-code-website**: bump \`v=\` in \`src/raptorcode/lib/raptorcodeLinks.ts\` and update \`DL_VERSION\` + SHA-256 strings in \`src/pages/beta/download.astro\`, then deploy:"
            echo '```'
            cat -- *.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
