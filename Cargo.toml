[workspace]
members = [
    "crates/raptor-agent",
    "crates/raptor-cli",
    "crates/raptor-core",
    "crates/raptor-git",
    "crates/raptor-providers",
    "crates/raptor-sandbox",
    "crates/raptor-store",
    "crates/raptor-tools",
    "crates/raptor-tui",
]
resolver = "2"

[workspace.package]
authors = ["RaptorLabs.dev"]
edition = "2021"
# Proprietary, closed-source. See LICENSE (RaptorLabs Proprietary EULA).
license = "LicenseRef-RaptorLabs-Proprietary"
# Hard guard: never publish RaptorCode source crates to a public registry.
publish = false
repository = "https://github.com/RaptorLabsHQ/raptor-code"
rust-version = "1.75"
version = "0.5.0"

[workspace.dependencies]
raptor-agent = { path = "crates/raptor-agent" }
raptor-cli = { path = "crates/raptor-cli" }
raptor-core = { path = "crates/raptor-core" }
raptor-git = { path = "crates/raptor-git" }
raptor-providers = { path = "crates/raptor-providers" }
raptor-sandbox = { path = "crates/raptor-sandbox" }
raptor-store = { path = "crates/raptor-store" }
raptor-tools = { path = "crates/raptor-tools" }
raptor-tui = { path = "crates/raptor-tui" }
crossterm = "0.27"
ratatui = { version = "0.26", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Release profile hardening. These raise the cost of reverse engineering the
# shipped binary (symbol/debug stripping, aggressive cross-crate inlining) while
# preserving runtime behavior. NOTE: panic strategy is intentionally left as the
# default "unwind" — the live swarm runs each specialist on its own thread and
# relies on unwinding to isolate a worker panic from the whole process; setting
# panic = "abort" would tear down every worker on a single panic.
[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
debug = false

