# cargo-deny supply-chain policy — checked in CI (security.yml) and runnable
# locally with `cargo deny check`. Advisories, license allow-list, duplicate
# tracking, and registry sources for the whole workspace.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Dependency licenses must come from this permissive allow-list: the vetted
# set actually present in the dependency tree today (the workspace itself is
# MIT OR Apache-2.0).
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
# Duplicate crate versions are reported but tolerated (the windows-sys family
# and a couple of build-graph splits make full deduplication impractical).
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
