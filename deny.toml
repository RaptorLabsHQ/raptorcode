# cargo-deny supply-chain policy — checked in CI (security.yml) and runnable
# locally with `cargo deny check`. Advisories, license allow-list, duplicate
# tracking, and registry sources for the whole workspace.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained (RUSTSEC-2024-0436), pulled in via ratatui 0.26.
    # Clearing it requires the ratatui 0.30 major bump, tracked separately
    # (breaking API migration). Re-evaluate when ratatui is bumped.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Dependency licenses must come from this permissive allow-list. The first
# entry is the workspace's own proprietary license (see LICENSE); everything
# else is the vetted set actually present in the dependency tree today.
allow = [
    "LicenseRef-RaptorLabs-Proprietary",
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
# Duplicate crate versions are reported but tolerated (the windows-sys family
# and a couple of build-graph splits make full deduplication impractical).
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
